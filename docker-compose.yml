version: '3.8'

services:
  backend:
    build:
      context: ./backend
      target: production
    container_name: ems-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/models/face:/app/models/face
    networks:
      - ems-network

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: production
    container_name: ems-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: npm run workers
    networks:
      - ems-network
    depends_on:
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: ems-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ems-network

  redis:
    image: redis:7-alpine
    container_name: ems-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ems-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ems-network:
    driver: bridge

volumes:
  redis_data:
