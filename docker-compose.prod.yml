version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: ems-nginx-proxy
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ems-backend-api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    expose:
      - '5000'

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ems-bullmq-worker
    restart: always
    command: ["node", "src/workers/start-workers.js"]
    environment:
      - NODE_ENV=production
    env_file:
      - ./backend/.env
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: ems-frontend-app
    restart: always
    expose:
      - '80'

  redis:
    image: redis:7-alpine
    container_name: ems-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  redis_data:
