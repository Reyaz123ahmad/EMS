name: Backend CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci_test_jwt_secret_12345
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_12345
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ems_test
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ems_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client & Sync DB
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run Backend Security Tests
        working-directory: backend
        run: node tests/security/xss.security.test.js

      - name: Run Unit Tests
        working-directory: backend
        run: node tests/unit/services/tax.service.test.js || true
